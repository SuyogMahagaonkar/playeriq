<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PlayerIQ — Watch Movies & TV Shows Free Online</title>
  <meta name="description" content="PlayerIQ lets you browse and watch movies, TV series, and anime trailers online. Discover trending, top-rated, and popular content in HD quality." />
  <meta property="og:title" content="PlayerIQ — Watch Movies & TV Shows Free Online" />
  <meta property="og:description" content="Discover trending movies, TV series, and anime. Watch trailers in HD quality." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0a0a0f" />
  <!-- Mobile / PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PlayerIQ" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <!-- Preconnect External Assets -->
  <link rel="preconnect" href="https://api.themoviedb.org" />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="dns-prefetch" href="https://api.themoviedb.org" />
  <link rel="dns-prefetch" href="https://image.tmdb.org" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
</head>
<body>
  <div id="app">
    <div id="splash-screen">
      <div class="splash-logo">
        <span class="splash-icon">▶</span>
        <span class="splash-text">Player<span class="splash-accent">IQ</span></span>
      </div>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
